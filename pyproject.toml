[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derivative-parity-ot"
version = "0.1.0"
description = "Research code for discrete event-contract OT and martingale OT bounds"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
research = ["matplotlib>=3.7", "pandas>=2.2", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
