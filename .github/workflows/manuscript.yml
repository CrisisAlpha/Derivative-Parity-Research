name: manuscript-build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF verifier
        run: python -m pip install -e '.[manuscript]'
      - name: Install pinned Tectonic
        run: |
          curl --fail --location --retry 3 https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/tectonic.tar.gz"
          mkdir -p "$RUNNER_TEMP/tectonic"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/tectonic"
          echo "$RUNNER_TEMP/tectonic" >> "$GITHUB_PATH"
      - name: Compile current manuscript and verify generated PDF
        run: python scripts/build_manuscript.py
      - name: Retain draft review artifact and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-review-${{ github.sha }}
          path: outputs/manuscript-build/
          if-no-files-found: error
          retention-days: 14
