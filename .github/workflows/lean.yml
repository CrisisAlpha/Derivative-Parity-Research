name: lean-formal-verification
on:
  push:
  pull_request:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: true
          build: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all proofs and audit kernel dependencies
        run: python scripts/check_lean.py
